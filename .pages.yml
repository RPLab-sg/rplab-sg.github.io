# Pages CMS (https://pagescms.org): web editor for members, news and outputs.
# Each entry is one JSON file. Saving in the CMS commits to the repo, and the deploy workflow publishes it.
# `npm run check` validates these files (scripts/validate-content.ts) — keep fields in step with app/content/types.ts.

# Reusable field groups (YAML anchors).
x-localized-line: &localized-line
  - { name: ko, label: 한국어, type: string }
  - { name: en, label: English, type: string }
x-localized-text: &localized-text
  - { name: ko, label: 한국어, type: text }
  - { name: en, label: English, type: text }
x-localized-list: &localized-list
  - { name: ko, label: 한국어, type: string, list: true }
  - { name: en, label: English, type: string, list: true }
x-localized-paragraphs: &localized-paragraphs
  - { name: ko, label: 한국어 (문단마다 한 칸), type: text, list: true }
  - { name: en, label: English (one per paragraph), type: text, list: true }
x-image: &image
  - { name: src, label: 이미지, type: image }
  - name: alt
    label: 대체 텍스트 (이미지 설명)
    type: object
    fields: *localized-line
x-timeline: &timeline
  - { name: period, label: 기간, type: object, fields: *localized-line }
  - { name: title, label: 내용, type: object, fields: *localized-line }
  - { name: note, label: 비고 (선택), type: object, fields: *localized-text }
x-status: &status
  name: status
  label: 공개 상태
  type: select
  default: published
  required: true
  options:
    values:
      - { value: published, label: 공개 }
      - { value: draft, label: 비공개 (초안) }
x-id: &id
  name: id
  label: ID (주소 이름과 같게)
  type: string
  required: true
x-slug: &slug
  name: slug
  label: 주소 이름 (영문 소문자·숫자·하이픈, 예 jinho-son)
  type: string
  required: true
  pattern:
    regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
    message: 영문 소문자, 숫자, 하이픈(-)만 쓸 수 있습니다.

media:
  input: public/images
  output: /images

content:
  - name: members
    label: 구성원
    type: collection
    path: app/content/members
    format: json
    filename: '{fields.slug}.json'
    view:
      primary: slug
      fields: [slug, role, order, status]
      sort: [order]
      default: { sort: order, order: asc }
    fields:
      - *id
      - *slug
      - name: role
        label: 구분
        type: select
        required: true
        options:
          values:
            - { value: professor, label: 교수 }
            - { value: phd, label: 박사과정 }
            - { value: ms, label: 석사과정 }
            - { value: undergraduate, label: 학부 연구생 }
            - { value: alumni, label: 졸업생 (목록에 표시 안 함) }
      - { name: order, label: 표시 순서 (작을수록 앞), type: number, required: true, default: 10 }
      - *status
      - { name: name, label: 이름, type: object, fields: *localized-line }
      - { name: position, label: 직위·과정, type: object, fields: *localized-line }
      - { name: education, label: 소속 학과 (선택), type: object, fields: *localized-line }
      - { name: photo, label: 사진 (선택), type: object, fields: *image }
      - name: contactSlots
        label: 학생 카드 아이콘 링크 (비워 두면 아이콘만 표시)
        type: object
        fields:
          - { name: github, label: GitHub 주소, type: string }
          - { name: email, label: 이메일, type: string }
      - { name: summary, label: 교수 소개 요약 (교수만), type: object, fields: *localized-text }
      - { name: keywords, label: 연구 키워드 (교수만), type: object, fields: *localized-list }
      - { name: email, label: 이메일 (교수만), type: string }
      - { name: phone, label: 전화 (교수만), type: string }
      - { name: office, label: 연구실 위치 (교수만), type: object, fields: *localized-line }
      - name: links
        label: 링크 버튼 (교수만)
        type: object
        list: true
        fields:
          - { name: kind, label: 종류 (아이콘 이름), type: string }
          - { name: label, label: 버튼 글자, type: object, fields: *localized-line }
          - { name: href, label: 주소 (비우면 비활성), type: string }
          - { name: external, label: 외부 사이트, type: boolean, default: true }
      - name: detail
        label: 전체 이력 페이지 (교수만, 비우면 페이지 없음)
        type: object
        fields:
          - { name: summary, label: 소개, type: object, fields: *localized-text }
          - name: research
            label: 연구 분야
            type: object
            list: true
            fields:
              - { name: title, label: 제목, type: object, fields: *localized-line }
              - { name: body, label: 설명, type: object, fields: *localized-text }
          - { name: experience, label: 경력, type: object, list: true, fields: *timeline }
          - { name: education, label: 학력, type: object, list: true, fields: *timeline }
          - { name: activities, label: 활동, type: object, list: true, fields: *timeline }
          - { name: source, label: 출처 표기 (선택), type: object, fields: *localized-line }

  - name: news
    label: 소식
    type: collection
    path: app/content/news
    format: json
    filename: '{fields.slug}.json'
    view:
      primary: slug
      fields: [slug, publishedAt, category, status]
      default: { sort: publishedAt, order: desc }
    fields:
      - *id
      - *slug
      - *status
      - name: publishedAt
        label: 날짜 (YYYY-MM-DD, 날짜를 모르면 YYYY)
        type: string
        required: true
        pattern:
          regex: '^\d{4}(-\d{2}-\d{2})?$'
          message: 2026-03-26 또는 2026 형식으로 입력하세요.
      - name: category
        label: 분류
        type: select
        required: true
        options:
          values:
            - { value: award, label: 수상 }
            - { value: research, label: 연구 }
            - { value: event, label: 행사 }
            - { value: notice, label: 공지 }
      - { name: title, label: 제목, type: object, fields: *localized-line }
      - { name: detail, label: 부제 (예 상 이름, 선택), type: object, fields: *localized-line }
      - { name: summary, label: 요약, type: object, fields: *localized-text }
      - { name: body, label: 본문, type: object, fields: *localized-paragraphs }
      - { name: cover, label: 대표 이미지 (선택), type: object, fields: *image }

  - name: outputs
    label: 성과
    type: collection
    path: app/content/outputs
    format: json
    filename: '{fields.slug}.json'
    view:
      primary: slug
      fields: [slug, type, year, featured, status]
      default: { sort: year, order: desc }
    fields:
      - *id
      - *slug
      - *status
      - name: type
        label: 분류
        type: select
        required: true
        options:
          values:
            - { value: tech-transfer, label: 기술이전 }
            - { value: collaboration, label: 산학협력 }
            - { value: paper, label: 논문 }
            - { value: project, label: 프로젝트 }
      - { name: year, label: 연도 (선택), type: number }
      - { name: title, label: 제목, type: object, fields: *localized-line }
      - { name: subtitle, label: 부제, type: object, fields: *localized-line }
      - { name: tag, label: 태그 (성과 페이지), type: object, fields: *localized-line }
      - { name: shortTag, label: 짧은 태그 (홈 카드), type: object, fields: *localized-line }
      - { name: description, label: 설명, type: object, fields: *localized-text }
      - { name: featured, label: 홈 Featured Projects에 표시, type: boolean, default: false }
      - { name: featuredOrder, label: 홈 표시 순서 (작을수록 앞, 선택), type: number }
      - { name: image, label: 이미지 (선택), type: object, fields: *image }
      - { name: href, label: 외부 링크 (선택), type: string }
